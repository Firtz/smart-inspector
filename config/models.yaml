# ==============================================================================
# SMART INSPECTOR SYSTEM - REGISTRI 5 MODEL AI (models.yaml)
# Catatan Penting:
# File bobot model (.onnx / .pt / .tflite), ukuran input pasti, skema normalisasi,
# dan daftar label kelas asli BELUM tersedia di repositori pada Minggu 1-2.
# Seluruh entri di bawah ini ditandai dengan `is_placeholder: true`.
# Jangan mengubah `is_placeholder` menjadi `false` sebelum file model asli
# ditempatkan di direktori `models/<kategori>/` dan diverifikasi.
# ==============================================================================

models:
  # ----------------------------------------------------------------------------
  # 1. Deteksi Kesehatan Tanaman (Plant Health Detection)
  # ----------------------------------------------------------------------------
  health_inspector:
    model_id: "health_inspector"
    name: "Plant Health Detection Model"
    task_type: "plant_health"
    # jenis output: "classification" | "object_detection" | "segmentation"
    output_type: "classification"
    enabled: false
    is_placeholder: true
    # Framework target: "mock" | "onnx" | "pytorch" | "tflite"
    framework: "mock"
    weights_path: "models/health/placeholder_health_model.onnx"
    input_spec:
      width: 224
      height: 224
      channels: 3
      color_format: "RGB"
      # Skala piksel: "0_to_1" (dibagi 255.0) atau "0_to_255"
      scale: "0_to_1"
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    confidence_threshold: 0.50
    # Label kelas placeholder - WAJIB diganti dengan daftar kelas dari tim AI trainer
    labels:
      - "PLACEHOLDER_HEALTHY"
      - "PLACEHOLDER_NUTRIENT_DEFICIENT"
      - "PLACEHOLDER_WATER_STRESSED"
    description: "Mendeteksi indikasi kesehatan umum tajuk/pelepah kelapa sawit."

  # ----------------------------------------------------------------------------
  # 2. Deteksi Indikasi Hama (Pest Indication Detection)
  # ----------------------------------------------------------------------------
  pest_detector:
    model_id: "pest_detector"
    name: "Pest Indication Detection Model"
    task_type: "pest_indication"
    output_type: "object_detection"
    enabled: false
    is_placeholder: true
    framework: "mock"
    weights_path: "models/pest/placeholder_pest_model.onnx"
    input_spec:
      width: 640
      height: 640
      channels: 3
      color_format: "RGB"
      scale: "0_to_1"
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
    confidence_threshold: 0.45
    iou_threshold: 0.45
    labels:
      - "PLACEHOLDER_BAGWORM_DAMAGE"
      - "PLACEHOLDER_NETTLE_CATERPILLAR"
      - "PLACEHOLDER_RHINOCEROS_BEETLE"
    description: "Mendeteksi gejala serangan hama pada daun/pelepah kelapa sawit."

  # ----------------------------------------------------------------------------
  # 3. Deteksi Indikasi Penyakit (Disease Indication Detection)
  # ----------------------------------------------------------------------------
  disease_detector:
    model_id: "disease_detector"
    name: "Disease Indication Detection Model"
    task_type: "disease_indication"
    output_type: "object_detection"
    enabled: false
    is_placeholder: true
    framework: "mock"
    weights_path: "models/disease/placeholder_disease_model.onnx"
    input_spec:
      width: 640
      height: 640
      channels: 3
      color_format: "RGB"
      scale: "0_to_1"
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
    confidence_threshold: 0.45
    iou_threshold: 0.45
    labels:
      - "PLACEHOLDER_GANODERMA_SYMPTOM"
      - "PLACEHOLDER_LEAF_SPOT"
      - "PLACEHOLDER_CROWN_DISEASE"
    description: "Mendeteksi indikasi penyakit tanaman kelapa sawit."

  # ----------------------------------------------------------------------------
  # 4. Deteksi Bunga / Penyerbukan (Flower / Pollination Detection)
  # ----------------------------------------------------------------------------
  flower_pollination:
    model_id: "flower_pollination"
    name: "Flower & Pollination Readiness Model"
    task_type: "flower_pollination"
    output_type: "object_detection"
    enabled: false
    is_placeholder: true
    framework: "mock"
    weights_path: "models/flower/placeholder_flower_model.onnx"
    input_spec:
      width: 640
      height: 640
      channels: 3
      color_format: "RGB"
      scale: "0_to_1"
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
    confidence_threshold: 0.50
    iou_threshold: 0.45
    labels:
      - "PLACEHOLDER_FEMALE_FLOWER_RECEPTIVE"
      - "PLACEHOLDER_FEMALE_FLOWER_POST_ANTHESIS"
      - "PLACEHOLDER_MALE_INFLORESCENCE"
    description: "Mendeteksi bunga kelapa sawit dan kesiapan penyerbukan."

  # ----------------------------------------------------------------------------
  # 5. Deteksi Kematangan Tandan Buah Segar / TBS (FFB Ripeness Detection)
  # [FOKUS VERTICAL SLICE MINGGU 2]
  # ----------------------------------------------------------------------------
  ripeness_ffb:
    model_id: "ripeness_ffb"
    name: "Fresh Fruit Bunch (FFB/TBS) Ripeness Model"
    task_type: "ffb_ripeness"
    output_type: "object_detection"
    enabled: true
    is_placeholder: true
    framework: "mock"
    weights_path: "models/ripeness/placeholder_ripeness_model.onnx"
    input_spec:
      width: 640
      height: 640
      channels: 3
      color_format: "RGB"
      scale: "0_to_1"
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
    confidence_threshold: 0.50
    iou_threshold: 0.45
    labels:
      - "PLACEHOLDER_FFB_UNRIPE"
      - "PLACEHOLDER_FFB_RIPE"
      - "PLACEHOLDER_FFB_OVERRIPE"
    description: "Mendeteksi tingkat kematangan Tandan Buah Segar (TBS / FFB) kelapa sawit."

